<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>馬印カードビルダー＋AI配分プレビュー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- html2canvas for image export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 16px;
            background: #e5e9f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .app-frame {
            margin: 0 auto;
            max-width: 430px;
            height: calc(100vh - 32px);
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header {
            flex: 0 0 auto;
            padding: 12px 16px 8px;
            background: #1e88e5;
            color: #fff;
        }

        .app-header-title {
            font-size: 16px;
            font-weight: 600;
        }

        .app-header-sub {
            font-size: 11px;
            opacity: 0.9;
            margin-top: 4px;
        }

        /* API設定・レース選択エリア */
        .config-section {
            flex: 0 0 auto;
            padding: 8px 12px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
        }

        .config-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .config-row:last-child {
            margin-bottom: 0;
        }

        .config-label {
            font-size: 11px;
            font-weight: 600;
            min-width: 70px;
        }

        .config-input {
            flex: 1;
            padding: 4px 8px;
            font-size: 11px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .config-select {
            flex: 1;
            padding: 4px 8px;
            font-size: 11px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: white;
        }

        .config-button {
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            background: #1e88e5;
            color: white;
            cursor: pointer;
        }

        .config-button:disabled {
            background: #90a4ae;
            cursor: not-allowed;
        }

        .config-status {
            font-size: 10px;
            color: #666;
            margin-left: 8px;
        }

        /* ツールバー（保存・復元） */
        .toolbar-section {
            flex: 0 0 auto;
            padding: 6px 12px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar-buttons {
            display: flex;
            gap: 6px;
        }

        .toolbar-button {
            padding: 3px 8px;
            font-size: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }

        .toolbar-button:hover {
            background: #f5f5f5;
        }

        .toolbar-notice {
            font-size: 9px;
            color: #888;
        }

        .app-main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* card box：上側（スクロール可） */
        .cardbox-section {
            height: 420px;  /* 固定高さで18枠完全表示 */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-top: 4px;
            border-bottom: 1px solid #e0e0e0;
        }

        .cardbox-header {
            padding: 4px 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cardbox-title {
            font-size: 12px;
            font-weight: 600;
        }

        .cardbox-controls {
            display: flex;
            gap: 4px;
        }

        .chip-button {
            border-radius: 999px;
            padding: 3px 8px;
            border: 1px solid #e0e0e0;
            background: #fafafa;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .chip-button.active {
            background: #1e88e5;
            color: #fff;
            border-color: transparent;
        }

        .chip-button span.dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .cardbox-filters {
            padding: 4px 12px 0;
            font-size: 9px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #666;
        }

        .cardbox-filters-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
        }

        .cardbox-filters-small {
            font-size: 9px;
            color: #777;
        }

        .filter-input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-end;
        }

        .filter-input {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 9px;
        }

        .filter-input input {
            width: 42px;
            font-size: 9px;
            padding: 2px 3px;
        }

        .cardbox-list-wrapper {
            flex: 1 1 auto;
            margin-top: 4px;
            padding: 4px 8px 8px;
            overflow: hidden;  /* スクロール無効化 */
        }

        .cardbox-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(6, 1fr);  /* 6行均等配置 */
            gap: 3px;
            height: 100%;
        }

        /* 空のプレースホルダー用カード */
        .horse-card-placeholder {
            padding: 4px;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
            background: #fafafa;
            opacity: 0.3;
        }

        .horse-card {
            padding: 4px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            font-size: 9px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 1px;
            position: relative;
            transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.08s;
        }

        .horse-card:active {
            transform: translateY(1px) scale(0.99);
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }

        .horse-card.selected {
            border-color: #1e88e5;
            box-shadow: 0 0 0 1px rgba(30,136,229,0.2);
        }

        .horse-card-header {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .horse-no-badge {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: #1e88e5;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 11px;
        }

        .horse-name {
            font-weight: 600;
            font-size: 11px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .horse-tagmark {
            font-size: 12px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 4px;
            background: #e3f2fd;
            color: #1e88e5;
        }

        .horse-card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #555;
        }

        .horse-meta-label {
            opacity: 0.8;
            margin-right: 2px;
        }

        .horse-ai-chip {
            margin-top: 2px;
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 999px;
            background: #f1f8e9;
            color: #558b2f;
            align-self: flex-start;
            line-height: 1.3;
        }

        /* 下側：印テーブル＋買い目生成＋買い目リスト */
        .marks-and-preview {
            flex: 0 0 auto;
            padding: 6px 12px 8px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
            max-height: 50vh;
            overflow-y: auto;
        }

        .marks-container {
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .mark-row {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #eeeeee;
            background: #ffffff;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .mark-row:last-child {
            border-bottom: none;
        }

        .mark-row.selected {
            background: #e3f2fd;
            box-shadow: inset 3px 0 0 #1e88e5;
        }

        .mark-label {
            display: flex;
            align-items: center;
            min-width: 80px;
        }

        .mark-color-bar {
            width: 4px;
            height: 24px;
            border-radius: 999px;
            margin-right: 8px;
        }

        .mark-symbol {
            font-size: 16px;
            margin-right: 4px;
        }

        .mark-name {
            font-size: 13px;
            font-weight: 600;
        }

        .mark-horses {
            flex: 1;
            min-height: 30px;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 4px;
            padding-left: 4px;
        }

        .mark-horses::-webkit-scrollbar {
            height: 4px;
        }

        .mark-horses::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 999px;
        }

        .mark-horse-pill {
            flex: 0 0 auto;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .mark-horse-no {
            font-weight: 600;
            padding: 2px 4px;
            border-radius: 3px;
            background: #f5f5f5;
        }

        .mark-ai-score {
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 3px;
            background: #e3f2fd;
            color: #1e88e5;
        }

        .preview-container {
            margin-top: 4px;
            padding: 6px 8px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            font-size: 10px;
        }

        .preview-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .preview-title {
            font-weight: 600;
            font-size: 11px;
        }

        .preview-budget-input {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 10px;
        }

        .preview-budget-input input {
            width: 80px;
            font-size: 10px;
            padding: 2px 4px;
        }

        .preview-form {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 4px;
        }

        .preview-form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .preview-form-row label {
            font-size: 10px;
            white-space: nowrap;
        }

        .preview-form-row select {
            font-size: 10px;
            padding: 2px 4px;
            flex: 1;
        }

        .preview-form-row .to-marks {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-end;
        }

        .to-mark-chip {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 999px;
            border: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .to-mark-chip input {
            margin: 0;
        }

        .preview-generate-button {
            margin-top: 2px;
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 6px 0;
            font-size: 11px;
            font-weight: 600;
            background: #1e88e5;
            color: #fff;
            cursor: pointer;
        }

        .preview-add-button {
            margin-top: 4px;
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 5px 0;
            font-size: 10px;
            font-weight: 600;
            background: #ffffff;
            color: #1e88e5;
            border: 1px solid #1e88e5;
            cursor: pointer;
        }

        .preview-combos-header {
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }

        .preview-combos-header strong {
            font-size: 11px;
        }

        .preview-combo-container {
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 60px;
            overflow-y: auto;
        }

        .preview-combo-chip {
            padding: 2px 6px;
            border-radius: 999px;
            border: 1px solid #e0e0e0;
            background: #fafafa;
            font-size: 10px;
        }

        .preview-note {
            margin-top: 4px;
            font-size: 9px;
            color: #777;
        }

        .preview-ai-button {
            margin-top: 6px;
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 6px 0;
            font-size: 11px;
            font-weight: 600;
            background: #43a047;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .preview-ai-button:disabled {
            background: #90a4ae;
            cursor: not-allowed;
        }

        .preview-ai-button span.icon {
            font-size: 14px;
        }

        .ai-result-toast {
            margin-top: 4px;
            padding: 4px 6px;
            font-size: 9px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #2e7d32;
            display: none;
        }

        .ai-result-toast.error {
            background: #ffebee;
            color: #c62828;
        }

        /* AI配分結果UI */
        .ai-allocation-result {
            margin-top: 12px;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #667eea;
            background: linear-gradient(135deg, #f8f9fa 0%, #e8f4f8 100%);
            display: none;
            min-height: 300px;
        }

        .ai-result-header {
            font-size: 16px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
            text-align: center;
        }

        .ai-result-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .ai-summary-card {
            padding: 12px;
            background: white;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }

        .ai-summary-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .ai-summary-value {
            font-size: 20px;
            font-weight: 700;
            color: #1e88e5;
        }

        .ai-risk-chart {
            height: 60px;
            background: white;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
            position: relative;
        }

        .risk-donut {
            width: 44px;
            height: 44px;
            margin: 0 auto;
        }

        /* 買い目リスト */
        .betlist-wrapper {
            margin-top: 6px;
            padding: 6px 8px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            font-size: 10px;
        }

        .betlist-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .betlist-title {
            font-weight: 600;
            font-size: 11px;
        }

        .betlist-summary {
            font-size: 9px;
            color: #555;
            text-align: right;
        }

        .betlist-summary span.value {
            font-weight: 600;
            margin-left: 2px;
        }

        .betlist-risk-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 999px;
            background: #fff8e1;
            color: #f9a825;
            margin-left: 4px;
        }

        .betlist-table-header {
            display: grid;
            grid-template-columns: 1.2fr 1.6fr 1fr 0.9fr 0.4fr;
            padding: 4px 6px;
            border-radius: 8px;
            background: #f5f5f5;
            font-weight: 600;
            font-size: 9px;
            margin-bottom: 2px;
        }

        .betlist-rows {
            max-height: 120px;
            overflow-y: auto;
        }

        .betlist-row {
            display: grid;
            grid-template-columns: 1.2fr 1.6fr 1fr 0.9fr 0.4fr;
            align-items: center;
            padding: 4px 6px;
            font-size: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .betlist-row:last-child {
            border-bottom: none;
        }

        .betlist-bettype {
            font-weight: 600;
        }

        .betlist-combination {
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
        }

        .betlist-odds {
            text-align: right;
        }

        .betlist-stake {
            text-align: right;
            font-weight: 600;
        }

        .betlist-stake.ai-allocated {
            color: #2e7d32;
        }

        .betlist-remove {
            text-align: center;
        }

        .betlist-remove button {
            border: none;
            background: transparent;
            color: #b0bec5;
            cursor: pointer;
            font-size: 12px;
        }

        .betlist-row.grade-A .betlist-odds {
            color: #2e7d32;
        }

        .betlist-row.grade-B .betlist-odds {
            color: #1976d2;
        }

        .betlist-row.grade-C .betlist-odds {
            color: #c62828;
        }

        .app-footer {
            flex: 0 0 auto;
            padding: 4px 12px 8px;
            font-size: 9px;
            color: #888;
            text-align: right;
            background: #fafafa;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
                background: #ffffff;
            }

            .app-frame {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-frame">
        <header class="app-header">
            <div class="app-header-title">馬印カードビルダー＋AI配分プレビュー</div>
            <div class="app-header-sub">
                レースデータ読み込み → 印付け → AI資金配分
            </div>
        </header>

        <!-- API設定・レース選択 -->
        <section class="config-section">
            <div class="config-row">
                <label class="config-label">Gemini API:</label>
                <input type="password" id="geminiApiKey" class="config-input" placeholder="APIキーを入力">
                <button class="config-button" id="saveApiKeyBtn">保存</button>
            </div>
            <div class="config-row">
                <label class="config-label">AIモデル:</label>
                <select id="geminiModel" class="config-select">
                  <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite (高速)</option>
                  <option value="gemini-2.5-flash">Gemini 2.5 Flash (高精度・低速)</option>
                </select>
            </div>
            <div class="config-row">
                <label class="config-label">レース選択:</label>
                <select id="raceSelect" class="config-select">
                    <option value="">レースを選択してください</option>
                </select>
                <button class="config-button" id="loadRaceBtn" disabled>読込</button>
                <span class="config-status" id="loadStatus"></span>
            </div>
        </section>

        <!-- ツールバー -->
        <section class="toolbar-section">
            <div class="toolbar-buttons">
                <button class="toolbar-button" id="saveStateBtn">📁 保存</button>
                <button class="toolbar-button" id="loadStateBtn">📂 復元</button>
                <button class="toolbar-button" id="exportImageBtn">📷 画像保存</button>
                <button class="toolbar-button" id="clearAllBtn">🗑️ クリア</button>
            </div>
            <div class="toolbar-notice">※保存データは24時間で自動削除</div>
        </section>

        <main class="app-main">
            <!-- 1. card box（上側） -->
            <section class="cardbox-section">
                <div class="cardbox-header">
                    <div class="cardbox-title">card box</div>
                    <div class="cardbox-controls">
                        <button class="chip-button active" id="sortPopularityBtn">
                            <span class="dot"></span>人気順
                        </button>
                        <button class="chip-button" id="sortWinBtn">
                            単勝順
                        </button>
                        <button class="chip-button" id="sortQuinellaBtn">
                            連対順
                        </button>
                        <button class="chip-button" id="sortShowBtn">
                            複勝順
                        </button>
                        <button class="chip-button" id="sortFinalBtn">
                            最終順
                        </button>
                    </div>
                </div>
                <div class="cardbox-filters">
                    <div class="cardbox-filters-row">
                        <div>タップで印に追加 / 再タップで解除</div>
                    </div>
                    <div class="cardbox-filters-row">
                        <div class="cardbox-filters-small">AIスコアフィルタ（以上・AND条件）</div>
                        <div class="filter-input-group">
                            <div class="filter-input">
                                単勝 <input type="number" id="filterAiWin" min="0" placeholder="-" />
                            </div>
                            <div class="filter-input">
                                連対 <input type="number" id="filterAiQuinella" min="0" placeholder="-" />
                            </div>
                            <div class="filter-input">
                                複勝 <input type="number" id="filterAiShow" min="0" placeholder="-" />
                            </div>
                            <div class="filter-input">
                                最終 <input type="number" id="filterFinal" min="0" placeholder="-" />

    const STORAGE_KEY_PREFIX = 'horse_mark_builder_';
    const STORAGE_EXPIRY_HOURS = 24;

    function saveToLocalStorage(key, data) {
        const timestamp = Date.now();
        const expiryTime = timestamp + (STORAGE_EXPIRY_HOURS * 60 * 60 * 1000);
        const storageData = {
            data: data,
            timestamp: timestamp,
            expiry: expiryTime
        };
        try {
            localStorage.setItem(STORAGE_KEY_PREFIX + key, JSON.stringify(storageData));
            return true;
        } catch (e) {
            console.error('LocalStorage保存エラー:', e);
            return false;
        }
    }

    function loadFromLocalStorage(key) {
        try {
            const item = localStorage.getItem(STORAGE_KEY_PREFIX + key);
            if (!item) return null;

            const storageData = JSON.parse(item);
            const now = Date.now();

            if (now > storageData.expiry) {
                localStorage.removeItem(STORAGE_KEY_PREFIX + key);
                return null;
            }

            return storageData.data;
        } catch (e) {
            console.error('LocalStorage読込エラー:', e);
            return null;
        }
    }

    function clearExpiredStorage() {
        const now = Date.now();
        const keys = Object.keys(localStorage);
        keys.forEach(key => {
            if (key.startsWith(STORAGE_KEY_PREFIX)) {
                try {
                    const item = localStorage.getItem(key);
                    const storageData = JSON.parse(item);
                    if (now > storageData.expiry) {
                        localStorage.removeItem(key);
                    }
                } catch (e) {
                    localStorage.removeItem(key);
                }
            }
        });
    }

    // ============================
    // レースデータ処理
    // ============================
    function processRaceData(raceData) {
        horses = [];

        if (!raceData || !raceData.horses) {
            console.error('馬データがありません');
            return;
        }

        // まず人気順を計算（オッズから）
        const popularityMap = {};
        if (currentOddsData && currentOddsData.length > 0) {
            const tanshoData = currentOddsData.find(o => o.odds_type === 'tfw');
            if (tanshoData && tanshoData.data && tanshoData.data.tansho) {
                // オッズで昇順ソート
                const sortedByOdds = [...tanshoData.data.tansho].sort((a, b) => {
                    const oddsA = parseFloat(a.odds) || 999;
                    const oddsB = parseFloat(b.odds) || 999;
                    return oddsA - oddsB;
                });

                // 人気順を馬番号にマッピング
                sortedByOdds.forEach((item, index) => {
                    popularityMap[item.horse_num] = index + 1;
                });
            }
        }

        raceData.horses.forEach(horse => {
            const horseNum = parseInt(horse.horse_number);

            // predictionsからAIスコアを取得（100倍して小数点以下2桁まで保持）
            let aiWin = 50.00;
            let aiQuinella = 50.00;
            let aiShow = 50.00;

            if (horse.predictions) {
                // 例: 0.9116055613436549 -> 91.16
                aiWin = Math.round((horse.predictions.win_rate || 0.5) * 10000) / 100;
                aiQuinella = Math.round((horse.predictions.place_rate || 0.5) * 10000) / 100;
                aiShow = Math.round((horse.predictions.show_rate || 0.5) * 10000) / 100;
            }

            // indicesから最終スコアを取得（そのまま使用）
            let finalScore = 50.0;
            if (horse.indices && horse.indices.final_score) {
                finalScore = horse.indices.final_score;
            }

            // 人気順を取得（なければ馬番号を使用）
            const popularity = popularityMap[String(horseNum)] || horseNum;

            // オッズを取得
            let winOdds = 10.0;
            if (currentOddsData && currentOddsData.length > 0) {
                const tanshoData = currentOddsData.find(o => o.odds_type === 'tfw');
                if (tanshoData && tanshoData.data && tanshoData.data.tansho) {
                    const oddsRow = tanshoData.data.tansho.find(r => String(r.horse_num) === String(horseNum));
                    if (oddsRow) {
                        winOdds = parseFloat(oddsRow.odds);
                    }
                }
            }

            horses.push({
                id: horseNum,
                name: horse.horse_name || `馬${horseNum}`,
                popularity: popularity,
                winOdds: winOdds,
                aiWin: aiWin,
                aiQuinella: aiQuinella,
                aiShow: aiShow,
                finalScore: finalScore
            });

            horseMarkMap[horseNum] = null;
        });

        // 人気順でソート（初期表示用）
        horses.sort((a, b) => a.popularity - b.popularity);
    }

    function renderCardBox() {

            if (aiFilterState.minAiShow !== null && h.aiShow < aiFilterState.minAiShow) return false;
            if (aiFilterState.minFinal !== null && h.finalScore < aiFilterState.minFinal) return false;

    function generateCombosFromMarks() {
        const betType = document.getElementById("betTypeSelect").value;
        const fromMarkId = document.getElementById("fromMarkSelect").value;
        const toMarkIds = getSelectedToMarkIds();

        const axisIds = getAssignedHorseIds(fromMarkId);
        const partnerIds = getHorseIdsByMarkIds(toMarkIds);

        if (axisIds.length === 0) {
            showToast("軸の印に馬がいません", "error");
            generatedCombos = [];
            renderComboResult();
            return;
        }

        if (partnerIds.length === 0 && betType !== "tanshou" && betType !== "fukushou") {
            showToast("相手の印を選んでください", "error");
            generatedCombos = [];
            renderComboResult();
            return;
        }

        const combosSet = new Set();

        function addCombo(arr, ordered) {
            const c = arr.slice();
            if (!ordered) {
                c.sort((a, b) => a - b);
            }
            const key = c.join("-");
            combosSet.add(key);
        }

        axisIds.forEach(axisId => {
            const filteredPartners = partnerIds.filter(pid => pid !== axisId);

            switch (betType) {
                case "tanshou":
                case "fukushou": {
                    const targets = new Set([...axisIds, ...partnerIds]);
                    targets.forEach(id => addCombo([id], false));
                    break;
                }
                case "umaren":
                case "wide": {
                    filteredPartners.forEach(pid => {
                        addCombo([axisId, pid], false);
                    });
                    break;
                }
                case "umatan": {
                    filteredPartners.forEach(pid => {
                        addCombo([axisId, pid], true);
                    });
                    break;
                }
                case "sanrenpuku": {
                    for (let i = 0; i < filteredPartners.length; i++) {
                        for (let j = i + 1; j < filteredPartners.length; j++) {
                            addCombo([axisId, filteredPartners[i], filteredPartners[j]], false);
                        }
                    }
                    break;
                }
                case "sanrentan": {
                    for (let i = 0; i < filteredPartners.length; i++) {
                        for (let j = 0; j < filteredPartners.length; j++) {
                            if (i === j) continue;
                            addCombo([axisId, filteredPartners[i], filteredPartners[j]], true);
                        }
                    }
                    break;
                }
            }
        });

    // ============================
    // オッズ処理
    // ============================
    function findOddsForCombo(betType, combo) {
        if (!currentOddsData) {
            return { text: "-", numeric: null, grade: "-" };
        }

        const oddsType = betTypeToOddsType[betType];
        if (!oddsType) {
            return { text: "-", numeric: null, grade: "-" };
        }

        const oddsForType = currentOddsData.find(o => o.odds_type === oddsType);
        if (!oddsForType || !oddsForType.data) {
            return { text: "-", numeric: null, grade: "-" };
        }

        if (oddsType === "tfw") {
            const horseNum = String(combo[0]);

            if (betType === "tanshou") {
                const row = (oddsForType.data.tansho || []).find(r => String(r.horse_num) === horseNum);
                if (!row) return { text: "-", numeric: null, grade: "-" };
                const val = parseFloat(row.odds);
                const grade = gradeOdds(val);
                return { text: val.toFixed(1) + "倍", numeric: val, grade };
            }

            if (betType === "fukushou") {
                const row = (oddsForType.data.fukusho || []).find(r => String(r.horse_num) === horseNum);
                if (!row || !row.odds) return { text: "-", numeric: null, grade: "-" };
                const min = parseFloat(row.odds.min);
                const max = parseFloat(row.odds.max);
                const avg = (min + max) / 2;
                const grade = gradeOdds(avg);
                return { text: min.toFixed(1) + " - " + max.toFixed(1), numeric: avg, grade };
            }
        }

        const key = combo.join("-");
        const list = oddsForType.data.combinations || [];
        const row = list.find(c => c.combination === key);

        if (!row) {
            return { text: "-", numeric: null, grade: "-" };
        }

        if (typeof row.odds === "object") {
            const min = parseFloat(row.odds.min);
            const max = parseFloat(row.odds.max || row.odds.min);
            const avg = (min + max) / 2;
            const grade = gradeOdds(avg);
            return { text: min.toFixed(1) + " - " + max.toFixed(1), numeric: avg, grade };
        } else {
            const val = parseFloat(row.odds);
            const grade = gradeOdds(val);
            return { text: val.toFixed(1) + "倍", numeric: val, grade };
        }
    }

    // ============================
    // 買い目リスト管理
    // ============================
    function addGeneratedCombosToBetList() {
        if (!generatedBetType || generatedCombos.length === 0) {
            showToast("先に印から買い目を生成してください", "error");
            return;
        }

        const betType = generatedBetType;
        const betTypeLabel = betTypeLabelMap[betType] || betType;

        let addedCount = 0;
        generatedCombos.forEach(combo => {
            const comboKey = combo.join("-");

            const exists = betList.some(b => b.betType === betType && b.comboKey === comboKey);
            if (exists) return;

            const oddsInfo = findOddsForCombo(betType, combo);

            betList.push({
                id: betIdCounter++,
                betType,
                betTypeLabel,
                combo: combo.slice(),
                comboKey,
                oddsText: oddsInfo.text,
                oddsNumeric: oddsInfo.numeric,
                grade: oddsInfo.grade,
                stake: 0
            });
            addedCount++;
        });

        if (addedCount > 0) {
            showToast(`${addedCount}点を買い目リストに追加しました`, "success");
        } else {
            showToast("すでに同じ買い目が登録されています", "info");
        }

        renderBetList();
    }

    // ============================

    async function executeAIAllocation() {
        const apiKey = document.getElementById('geminiApiKey').value;
        const selectedModel = document.getElementById('geminiModel').value;
        const budget = parseInt(document.getElementById('budgetInput').value, 10) || 0;

        if (!apiKey) {
            showToast("Gemini APIキーを入力してください", "error");
            return;
        }

        if (betList.length === 0) {
            showToast("買い目リストに1点以上追加してください", "error");
            return;
        }

        if (budget <= 0) {
            showToast("予算を入力してください", "error");
            return;
        }

        const betData = betList.map(bet => {
            // 各馬の印を取得
            const horseMarks = bet.combo.map(horseNum => {
                const markId = horseMarkMap[horseNum];
                const mark = marks.find(m => m.id === markId);
                return mark ? mark.symbol : "無印";
            });

            return {
                id: bet.id,
                type: bet.betType,
                combination: bet.combo.join("-"),
                odds: bet.oddsNumeric || 10,
                grade: bet.grade,
                marks: horseMarks
            };
        });

        // 馬印配置データを作成
        const markData = {};
        marks.forEach(mark => {
            const assignedHorses = getAssignedHorseIds(mark.id);
            if (assignedHorses.length > 0) {
                markData[mark.symbol] = {
                    name: mark.name,
                    horses: assignedHorses
                };
            }
        });

        const prompt = `
以下の競馬の買い目に対して、予算${budget}円を最適配分してください。

買い目データ（JSON形式）:
${JSON.stringify(betData, null, 2)}

馬印配置データ:
${JSON.stringify(markData, null, 2)}

印の一般的な意味（参考）:
◎本命、○対抗、▲単穴、△連下、☆注、抑え

配分の条件：
1. 各買い目は最低100円、100円単位で配分
2. 合計金額は必ず予算${budget}円ちょうどになること
3. トリガミ（的中しても投資総額を回収できない）を極力回避すること

配分の方針：
- 馬印配置とオッズを総合的に分析して、ユーザーの意図を理解した配分を行う
- 買い目の点数、オッズ分布、馬印の組み合わせから最適な戦略を判断
- トリガミ回避を優先しつつ、効率的な資金配分を実現

必ず以下のJSON形式で回答してください（説明や補足は一切不要）：
{
  "allocations": [
    {"id": 1, "amount": 金額},
    ...
  ],
  "risk_level": "低/中/高",
  "expected_max_return": 最大想定払戻金額
}
`;

        try {
            showToast("AI配分を実行中...", "info");
            document.getElementById('aiButton').disabled = true;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: prompt
                        }]
                    }],
                    generationConfig: {
                        temperature: 0.2,
                        topK: 1,
                        topP: 0.8,
                        maxOutputTokens: 1024,
                    }
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'API呼び出しエラー');
            }

            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;

            const jsonStr = aiResponse.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
            const allocation = JSON.parse(jsonStr);

            if (allocation.allocations) {
                allocation.allocations.forEach(alloc => {
                    const bet = betList.find(b => b.id === alloc.id);
                    if (bet) {
                        bet.stake = alloc.amount;
                    }
                });
            }

            renderBetList();
            displayAIResult(allocation);

            showToast("AI配分が完了しました", "success");

        } catch (error) {
            console.error('AI配分エラー:', error);
            showToast("AI配分に失敗しました: " + error.message, "error");
        } finally {
            document.getElementById('aiButton').disabled = false;
        }
    }

    function drawRiskDonutChart(allocation) {
        const canvas = document.getElementById('riskDonutCanvas');
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, 44, 44);

        let gradeA = 0, gradeB = 0, gradeC = 0;

        betList.forEach(bet => {
            if (bet.stake > 0) {
                if (bet.grade === "A") gradeA += bet.stake;
                else if (bet.grade === "B") gradeB += bet.stake;
                else if (bet.grade === "C") gradeC += bet.stake;
            }
        });

        const total = gradeA + gradeB + gradeC;
        if (total === 0) return;

        const centerX = 22;
        const centerY = 22;
        const radius = 20;
        const innerRadius = 12;

        let currentAngle = -Math.PI / 2;

        const segments = [
            { value: gradeA, color: '#43a047', label: '堅' },
            { value: gradeB, color: '#1e88e5', label: '中' },
            { value: gradeC, color: '#e53935', label: '穴' }
        ];

        segments.forEach(segment => {
            if (segment.value === 0) return;

            const angle = (segment.value / total) * Math.PI * 2;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, currentAngle, currentAngle + angle);
            ctx.arc(centerX, centerY, innerRadius, currentAngle + angle, currentAngle, true);
            ctx.closePath();
            ctx.fillStyle = segment.color;
            ctx.fill();

            currentAngle += angle;
        });
    }

        betList = [];
        generatedCombos = [];
        generatedBetType = null;

        Object.keys(aiFilterState).forEach(key => {
            aiFilterState[key] = null;
        });

        document.getElementById('filterAiWin').value = '';
        document.getElementById('filterAiQuinella').value = '';
        document.getElementById('filterAiShow').value = '';
        document.getElementById('filterFinal').value = '';

        renderMarks();
        renderCardBox();
        renderComboResult();
        renderBetList();

        document.getElementById('aiAllocationResult').style.display = 'none';

        showToast('すべてクリアしました', 'success');
    }

    async function exportAsImage() {
        const marksContainer = document.getElementById('marksContainer');

        try {
            showToast('画像を生成中...', 'info');

            const canvas = await html2canvas(marksContainer, {
                backgroundColor: '#ffffff',
                scale: 2
            });

            const link = document.createElement('a');
            const fileName = `horse_marks_${selectedRaceId}_${Date.now()}.png`;
            link.download = fileName;
            link.href = canvas.toDataURL();
            link.click();

            showToast('画像を保存しました', 'success');
        } catch (error) {
            console.error('画像エクスポートエラー:', error);
            showToast('画像の生成に失敗しました', 'error');
        }
    }

    // ============================
    // イベントリスナー設定
    // ============================
    function setupCardboxControls() {
        // ソートボタン - 人気順
        document.getElementById("sortPopularityBtn").addEventListener("click", () => {
            currentSort = "popularity";
            updateSortButtons();
            renderCardBox();
        });

        // ソートボタン - 単勝順
        document.getElementById("sortWinBtn").addEventListener("click", () => {
            currentSort = "win";
            updateSortButtons();
            renderCardBox();
        });

        // ソートボタン - 連対順
        document.getElementById("sortQuinellaBtn").addEventListener("click", () => {
            currentSort = "quinella";
            updateSortButtons();
            renderCardBox();
        });

        // ソートボタン - 複勝順
        document.getElementById("sortShowBtn").addEventListener("click", () => {
            currentSort = "show";
            updateSortButtons();
            renderCardBox();
        });

        // ソートボタン - 最終順
        document.getElementById("sortFinalBtn").addEventListener("click", () => {
            currentSort = "final";
            updateSortButtons();
            renderCardBox();
        });

        // フィルター入力
        function hookFilterInput(id, key) {
            const el = document.getElementById(id);
            el.addEventListener("input", () => {
                const v = el.value.trim();
                aiFilterState[key] = v === "" ? null : parseInt(v, 10);
                renderCardBox();
            });
        }

        hookFilterInput("filterAiWin", "minAiWin");
        hookFilterInput("filterAiQuinella", "minAiQuinella");
        hookFilterInput("filterAiShow", "minAiShow");
        hookFilterInput("filterFinal", "minFinal");
    }

    function updateSortButtons() {
        // すべてのソートボタンをリセット
        const buttons = {
            'popularity': document.getElementById("sortPopularityBtn"),
            'win': document.getElementById("sortWinBtn"),
            'quinella': document.getElementById("sortQuinellaBtn"),
            'show': document.getElementById("sortShowBtn"),
            'final': document.getElementById("sortFinalBtn")
        };

        // すべてのボタンからアクティブクラスとドットを削除
        Object.values(buttons).forEach(btn => {
            btn.classList.remove("active");
            const dot = btn.querySelector('.dot');
            if (dot) dot.remove();
        });

        // 現在のソートボタンをアクティブに設定し、ドットを追加
        if (buttons[currentSort]) {
            buttons[currentSort].classList.add("active");
            const dot = document.createElement('span');
            dot.className = 'dot';
            buttons[currentSort].insertBefore(dot, buttons[currentSort].firstChild);
        }
    }

    function setupApiKeyManagement() {
        const apiKeyInput = document.getElementById('geminiApiKey');
        const saveBtn = document.getElementById('saveApiKeyBtn');
        const aiButton = document.getElementById('aiButton');

        const savedApiKey = loadFromLocalStorage('gemini_api_key');
        if (savedApiKey) {
            apiKeyInput.value = savedApiKey;
            aiButton.disabled = false;
        }

        saveBtn.addEventListener('click', () => {
            const apiKey = apiKeyInput.value.trim();
            if (apiKey) {
                saveToLocalStorage('gemini_api_key', apiKey);
                aiButton.disabled = false;
                showToast('APIキーを保存しました', 'success');
            } else {
                showToast('APIキーを入力してください', 'error');
            }
        });

        apiKeyInput.addEventListener('input', () => {
            const hasKey = apiKeyInput.value.trim().length > 0;
            aiButton.disabled = !hasKey;
        });
    }

    async function setupRaceSelection() {
        const raceSelect = document.getElementById('raceSelect');
        const loadBtn = document.getElementById('loadRaceBtn');
        const loadStatus = document.getElementById('loadStatus');

        try {
            loadStatus.textContent = '読込中...';
            const races = await loadAllRaceData();

            if (races.length === 0) {
                loadStatus.textContent = 'レースなし';
                return;
            }

            // レース選択をクリア
            raceSelect.innerHTML = '<option value="">レースを選択してください</option>';

            races.forEach(race => {
                const raceId = race.race_id || race.data?.race_id;
                const raceName = race.data?.race_name || race.race_name || '';

                if (!raceId) return;

                const option = document.createElement('option');
                option.value = raceId;
                option.textContent = `${raceId} - ${raceName}`;
                raceSelect.appendChild(option);
            });

            loadStatus.textContent = `${races.length}レース`;

            raceSelect.addEventListener('change', () => {
                loadBtn.disabled = !raceSelect.value;
            });

            loadBtn.addEventListener('click', async () => {
                const raceId = raceSelect.value;
                if (!raceId) return;

                await loadRaceData(raceId);
            });

        } catch (error) {
            console.error('レース一覧取得エラー:', error);
            loadStatus.textContent = 'エラー';
            showToast('レース一覧の取得に失敗しました', 'error');
        }
    }

    async function loadRaceData(raceId) {
        const loadStatus = document.getElementById('loadStatus');

        try {
            loadStatus.textContent = '読込中...';

            const raceData = await loadSingleRaceData(raceId);
            if (!raceData) {
                throw new Error('レースデータが見つかりません');
            }

            currentRaceData = raceData;
            selectedRaceId = raceId;

            // オッズデータを先に読み込む（人気順計算に必要）
            const oddsData = await loadOddsData(raceId);
            currentOddsData = oddsData;

            // オッズデータを取得してから馬データを処理
            processRaceData(raceData);

            Object.keys(horseMarkMap).forEach(key => {
                horseMarkMap[key] = null;
            });
            betList = [];
            generatedCombos = [];
            generatedBetType = null;

            renderMarks();
            renderCardBox();
            setupPreviewControls();
            renderComboResult();
            renderBetList();

            loadStatus.textContent = '読込完了';
            showToast(`${raceId}のデータを読み込みました`, 'success');

            const savedState = loadFromLocalStorage(`state_${raceId}`);
            if (savedState) {
                if (confirm('このレースの保存データがあります。復元しますか？')) {
                    loadSavedState();
                }
            }

        } catch (error) {
            console.error('レースデータ読込エラー:', error);
            loadStatus.textContent = 'エラー';
            showToast('レースデータの読込に失敗しました', 'error');
        }
    }

    function setupToolbar() {
        document.getElementById('saveStateBtn').addEventListener('click', () => {
            saveCurrentState();
        });

        document.getElementById('loadStateBtn').addEventListener('click', () => {
            loadSavedState();
        });

        document.getElementById('exportImageBtn').addEventListener('click', () => {
            exportAsImage();
        });

        document.getElementById('clearAllBtn').addEventListener('click', () => {
            clearAllData();
        });
    }

    // ============================
    // 初期化
    // ============================
    async function init() {
        try {
            clearExpiredStorage();

            setupApiKeyManagement();
            await setupRaceSelection();
            setupToolbar();
            setupCardboxControls();

            document.getElementById("generateButton").addEventListener("click", () => {
                generateCombosFromMarks();
            });

            document.getElementById("addToBetListButton").addEventListener("click", () => {
                addGeneratedCombosToBetList();
            });

            document.getElementById("aiButton").addEventListener("click", () => {
                executeAIAllocation();
            });

            const cardGrid = document.getElementById('cardBoxGrid');
            if (cardGrid.children.length === 0) {
                const msg = document.createElement('div');
                msg.style.gridColumn = '1 / -1';
                msg.style.padding = '20px';
                msg.style.textAlign = 'center';
                msg.style.color = '#999';
                msg.style.fontSize = '11px';
                msg.innerHTML = '上部のレース選択から<br>レースを選んで読込してください';
                cardGrid.appendChild(msg);
            }

            renderMarks();
            setupPreviewControls();
            renderComboResult();
            renderBetList();

            console.log('馬印カードビルダー初期化完了');

        } catch (error) {
            console.error('初期化エラー:', error);
            showToast('初期化に失敗しました', 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
